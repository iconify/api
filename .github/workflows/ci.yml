name: ci

on:
    push:
        branches:
            - main
            - next
    pull_request:
        branches:
            - main
            - next

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v7
              with:
                  node-version: 'latest'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🚧 Build project
              run: npm run build

            - name: 🧪 Test project
              run: npm run test
